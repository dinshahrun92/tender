<div class="drawer-overlay" id="drawerOverlay" onclick="closeDrawer()"></div>
<div class="drawer" id="tenderDrawer">

  <!-- HERO -->
  <div class="drawer-hero">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px">
      <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap">
        <span id="dId" onclick="copyId()" style="font-family:'DM Mono',monospace;font-size:10px;font-weight:600;background:rgba(255,255,255,.12);color:rgba(255,255,255,.8);padding:3px 8px;border-radius:5px;cursor:pointer;border:1px solid rgba(255,255,255,.15);letter-spacing:.3px" title="Click to copy">ID</span>
        <span id="dStatusBadge" class="badge b-calling" style="font-size:10px">Status</span>
        <span id="dPriorityBadge" style="display:none;font-size:10px;padding:3px 8px;border-radius:5px;font-weight:600"></span>
        <button onclick="toggleWatch()" id="watchBtn" style="display:flex;align-items:center;gap:4px;font-size:11px;color:rgba(255,255,255,.5);background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);padding:3px 9px;border-radius:5px;cursor:pointer;font-family:'DM Sans',sans-serif">
          <i class="fa-regular fa-eye" style="font-size:10px"></i> Watch
        </button>
      </div>
      <div onclick="closeDrawer()" style="width:30px;height:30px;border-radius:7px;display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,.4);cursor:pointer;background:rgba(255,255,255,.06)">
        <i class="fa-solid fa-xmark" style="font-size:13px"></i>
      </div>
    </div>

    <div id="dTitle" style="font-size:15px;font-weight:700;color:#fff;line-height:1.4;cursor:text;padding:4px 6px;margin:-4px -6px;border-radius:6px;word-break:break-word" contenteditable="false" onblur="saveTitleEdit()" onclick="enableTitleEdit(this)">Title</div>

    <div style="display:flex;align-items:center;gap:10px;margin-top:10px;flex-wrap:wrap">
      <div style="display:flex;align-items:center;gap:5px"><i class="fa-regular fa-building" style="color:rgba(255,255,255,.35);font-size:10px"></i><span id="dAgencyHero" style="font-size:12px;color:rgba(255,255,255,.55);font-weight:500">Agency</span></div>
      <div style="width:3px;height:3px;border-radius:50%;background:rgba(255,255,255,.2)"></div>
      <div style="display:flex;align-items:center;gap:5px"><i class="fa-regular fa-user" style="color:rgba(255,255,255,.35);font-size:10px"></i><span id="dOwnerHero" style="font-size:12px;color:rgba(255,255,255,.55);font-weight:500">Owner</span></div>
      <div style="width:3px;height:3px;border-radius:50%;background:rgba(255,255,255,.2)"></div>
      <div id="dTeamAvatarsHero" style="display:flex"></div>
    </div>

    <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px">
      <div style="background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.1);border-radius:var(--r-md);padding:9px 11px"><div style="font-size:9px;font-weight:700;color:rgba(255,255,255,.35);text-transform:uppercase;letter-spacing:.7px;margin-bottom:4px">Due</div><div id="dDue" style="font-size:12px;font-weight:700;color:#fff;font-family:'DM Mono',monospace">—</div></div>
      <div style="background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.1);border-radius:var(--r-md);padding:9px 11px"><div style="font-size:9px;font-weight:700;color:rgba(255,255,255,.35);text-transform:uppercase;letter-spacing:.7px;margin-bottom:4px">Days Left</div><div id="dDaysLeft" style="font-size:12px;font-weight:700;color:#fff">—</div></div>
      <div style="background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.1);border-radius:var(--r-md);padding:9px 11px"><div style="font-size:9px;font-weight:700;color:rgba(255,255,255,.35);text-transform:uppercase;letter-spacing:.7px;margin-bottom:4px">Tasks</div><div id="dHealth" style="font-size:12px;font-weight:700;color:#fff">—</div></div>
      <div style="background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.1);border-radius:var(--r-md);padding:9px 11px"><div style="font-size:9px;font-weight:700;color:rgba(255,255,255,.35);text-transform:uppercase;letter-spacing:.7px;margin-bottom:4px">Value</div><div id="dValueHero" style="font-size:12px;font-weight:700;color:#fff">RM —</div></div>
    </div>

    <div class="dtabs">
      <button onclick="drawerTab('overview')"   id="dt-overview"   class="dtab on">Overview</button>
      <button onclick="drawerTab('checklist')"  id="dt-checklist"  class="dtab">Checklist <span id="taskPct" style="font-size:9px;background:rgba(255,255,255,.15);padding:1px 5px;border-radius:3px;color:rgba(255,255,255,.6)">0%</span></button>
      <button onclick="drawerTab('discussion')" id="dt-discussion" class="dtab">Discussion</button>
      <button onclick="drawerTab('activity')"   id="dt-activity"   class="dtab">Activity</button>
      <button onclick="drawerTab('files')"      id="dt-files"      class="dtab">Files</button>
    </div>
  </div>

  <!-- BODY -->
  <div class="drawer-body">

    <!-- OVERVIEW TAB -->
    <div id="dc-overview">

      <!-- Status + Price -->
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px">
        <div class="card" style="padding:13px 15px">
          <div class="label" style="margin-bottom:7px">Status</div>
          <select id="dStatus" onchange="updateStatus()" class="inp" style="padding:6px 10px;font-size:13px;font-weight:600">
            <option>Calling For Tender</option><option>Active</option><option>Review</option>
            <option>Submitted</option><option>Successful</option><option>Closed</option>
            <option>Unsuccessful</option><option>Cancelled</option>
          </select>
        </div>
        <div class="card" style="padding:13px 15px">
          <div class="label" style="margin-bottom:7px">Contract Value (RM)</div>
          <input id="dPrice" type="text" class="inp" style="padding:5px 8px;font-size:20px;font-weight:800;letter-spacing:-.5px;border-color:transparent;background:transparent;padding-left:0" placeholder="0.00" onblur="savePrice()" onfocus="unformatPrice(this)">
        </div>
      </div>

      <!-- Agency + Priority + Start Date + Due Date -->
      <div class="card" style="padding:13px 15px;margin-bottom:12px">
        <!-- Row 1: Agency + Priority -->
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px">
          <div>
            <div class="label" style="margin-bottom:5px">Agency</div>
            <div id="dAgency" style="font-size:14px;font-weight:700;color:var(--ink)">—</div>
          </div>
          <div>
            <div class="label" style="margin-bottom:5px">Priority</div>
            <select id="dPrioritySelect" onchange="savePriority()" class="inp" style="padding:5px 9px;font-size:13px;font-weight:600;width:auto">
              <option>Normal</option><option>Low</option><option>High</option><option>Critical</option>
            </select>
          </div>
        </div>
        <!-- Row 2: Start Date + Due Date (editable) -->
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px">
          <div>
            <div class="label" style="margin-bottom:5px;display:flex;align-items:center;gap:5px">
              <i class="fa-regular fa-calendar-plus" style="color:var(--green);font-size:10px"></i>
              Start Date
            </div>
            <input
              id="dStartDate"
              type="date"
              class="inp"
              onchange="saveStartDate()"
              style="font-size:12px;font-weight:600;padding:6px 9px;border-color:var(--line)"
              title="Edit start date"
            >
          </div>
          <div>
            <div class="label" style="margin-bottom:5px;display:flex;align-items:center;gap:5px">
              <i class="fa-regular fa-calendar-xmark" style="color:var(--red);font-size:10px"></i>
              Due Date &amp; Time
            </div>
            <input
              id="dDueDate"
              type="datetime-local"
              class="inp"
              onchange="saveDueDate()"
              style="font-size:12px;font-weight:600;padding:6px 9px;border-color:var(--line)"
              title="Edit due date"
            >
          </div>
        </div>
        <div style="margin-top:14px;padding-top:12px;border-top:1px solid var(--line)">
          <div class="label" style="margin-bottom:5px;display:flex;align-items:center;gap:5px">
            <i class="fa-regular fa-clipboard" style="color:var(--blue);font-size:10px"></i>
            Tender Briefing
          </div>
          <div id="dBriefing" style="font-size:13px;font-weight:600;color:var(--ink)">—</div>
        </div>
      </div>

      <!-- Task Completion Progress -->
      <div class="card" style="padding:13px 15px;margin-bottom:12px">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
          <div><div class="h3" style="margin-bottom:2px">Task Completion</div><div class="caption" id="progSubtitle">No tasks added yet</div></div>
          <span id="progPct" style="font-size:28px;font-weight:800;color:var(--blue);letter-spacing:-1px;line-height:1">0%</span>
        </div>
        <div class="pbar-wrap" style="height:6px;border-radius:3px"><div id="progBar" class="pbar-fill" style="width:0%;height:6px;border-radius:3px"></div></div>
      </div>

      <!-- Drive Links -->
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px">
        <a id="dDriveLink" href="#" target="_blank" style="display:flex;align-items:center;gap:10px;padding:12px 14px;background:var(--white);border:1px solid var(--line);border-radius:var(--r-lg);text-decoration:none;transition:all .15s;box-shadow:var(--sh-sm)">
          <div style="width:34px;height:34px;border-radius:9px;background:var(--blue-l);display:flex;align-items:center;justify-content:center;flex-shrink:0"><i class="fa-brands fa-google-drive" style="color:var(--blue);font-size:14px"></i></div>
          <div><div style="font-size:13px;font-weight:600;color:var(--ink)">Open Drive</div><div class="caption" style="margin-top:1px">View all files</div></div>
          <i class="fa-solid fa-arrow-up-right-from-square" style="color:var(--mute2);font-size:10px;margin-left:auto"></i>
        </a>
        <button onclick="shareFolder()" style="display:flex;align-items:center;gap:10px;padding:12px 14px;background:var(--white);border:1px solid var(--line);border-radius:var(--r-lg);transition:all .15s;cursor:pointer;box-shadow:var(--sh-sm);font-family:'DM Sans',sans-serif">
          <div style="width:34px;height:34px;border-radius:9px;background:var(--purple-l);display:flex;align-items:center;justify-content:center;flex-shrink:0"><i class="fa-solid fa-folder-plus" style="color:var(--purple);font-size:14px"></i></div>
          <div style="text-align:left"><div style="font-size:13px;font-weight:600;color:var(--ink)">Share to My Drive</div><div class="caption" style="margin-top:1px">Add shortcut</div></div>
        </button>
      </div>

      <!-- Delete -->
      <div style="padding-top:10px;border-top:1px solid var(--line)">
        <button onclick="deleteTender()" class="btn btn-danger btn-sm"><i class="fa-regular fa-trash-can"></i> Delete this project</button>
      </div>
    </div>

    <!-- CHECKLIST TAB -->
    <div id="dc-checklist" style="display:none">
      <div style="background:var(--snow);border:1px solid var(--line);border-radius:var(--r-md);padding:11px;margin-bottom:12px">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:7px"><span class="h3">Progress</span><span id="clPct" style="font-size:12px;font-weight:700;color:var(--blue)">0%</span></div>
        <div class="pbar-wrap"><div id="clBar" class="pbar-fill" style="width:0%"></div></div>
      </div>
      <div style="background:var(--white);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden;margin-bottom:10px"><div id="taskList"></div></div>
      <div style="background:var(--snow);border:1px solid var(--line);border-radius:var(--r-lg);padding:10px 12px;display:flex;flex-direction:column;gap:8px">
        <div style="display:flex;align-items:center;gap:8px">
          <i class="fa-solid fa-plus" style="color:var(--mute);font-size:11px;flex-shrink:0"></i>
          <input id="newTaskDesc" class="inp" style="background:transparent;border:none;padding:0;font-size:13px;flex:1" placeholder="Add new task…">
          <button onclick="addTaskQuick()" class="btn btn-primary btn-sm">Add</button>
        </div>
        <div style="display:flex;align-items:center;gap:7px;padding-left:19px">
          <i class="fa-solid fa-user-plus" style="color:var(--mute);font-size:10px;flex-shrink:0"></i>
          <div id="taskAssignWrap" style="display:flex;flex-wrap:wrap;gap:4px;flex:1;cursor:pointer" onclick="openTaskAssignPicker()">
            <span id="taskAssignPlaceholder" class="caption">Assign to… (optional)</span>
          </div>
        </div>
        <div id="taskAssignPicker" style="display:none;background:var(--white);border:1px solid var(--line);border-radius:var(--r-md);padding:6px;max-height:160px;overflow-y:auto;margin-left:19px"></div>
      </div>
    </div>

    <!-- DISCUSSION TAB -->
    <div id="dc-discussion" style="display:none;height:calc(100vh - 310px);flex-direction:column">
      <div id="chatList" style="flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:9px;margin-bottom:11px;padding-right:2px;min-height:280px"></div>
      <div style="position:relative;flex-shrink:0">
        <div id="mentionDrop" class="mention-drop"></div>
        <div style="background:var(--snow);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden">
          <div style="display:flex;gap:2px;padding:7px 7px 0">
            <button onclick="setCType('message')"  id="ct-message"  style="padding:3px 10px;border-radius:5px;font-size:11px;font-weight:600;color:var(--mute);background:var(--white);border:1px solid var(--line);cursor:pointer">💬 Message</button>
            <button onclick="setCType('decision')" id="ct-decision" style="padding:3px 10px;border-radius:5px;font-size:11px;font-weight:600;color:var(--mute);background:transparent;border:1px solid transparent;cursor:pointer">✅ Decision</button>
            <button onclick="setCType('question')" id="ct-question" style="padding:3px 10px;border-radius:5px;font-size:11px;font-weight:600;color:var(--mute);background:transparent;border:1px solid transparent;cursor:pointer">❓ Question</button>
            <button onclick="setCType('blocker')"  id="ct-blocker"  style="padding:3px 10px;border-radius:5px;font-size:11px;font-weight:600;color:var(--mute);background:transparent;border:1px solid transparent;cursor:pointer">🚫 Blocker</button>
          </div>
          <div style="display:flex;align-items:center;gap:7px;padding:7px 9px">
            <input id="chatInput" class="inp" style="background:transparent;border:none;padding:4px 5px;flex:1;font-size:13px" placeholder="Type a message… (@ to mention)" oninput="handleMention(this)" onkeydown="chatKey(event)">
            <button onclick="postComment()" class="btn btn-primary btn-sm" style="width:32px;height:32px;padding:0;border-radius:7px;flex-shrink:0"><i class="fa-solid fa-paper-plane" style="font-size:11px"></i></button>
          </div>
        </div>
      </div>
    </div>

    <!-- ACTIVITY TAB -->
    <div id="dc-activity" style="display:none">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:11px">
        <span class="h3">Project Activity Log</span>
        <div id="drawerPresence" style="display:flex;align-items:center;gap:3px"></div>
      </div>
      <div id="activityList"></div>
    </div>

    <!-- FILES TAB -->
    <div id="dc-files" style="display:none">
      <div style="background:var(--white);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden">
        <div style="padding:10px 14px;border-bottom:1px solid var(--line)"><span class="h3">Project Files</span></div>
        <div id="fileList" style="padding:6px"></div>
      </div>
    </div>

  </div><!-- /drawer-body -->
</div><!-- /drawer -->
