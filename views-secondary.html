<!-- TEAM FEED -->
<div id="view-feed" style="display:none">
  <div style="display:grid;grid-template-columns:1fr 280px;gap:14px">
    <div class="card" style="overflow:hidden">
      <div class="card-hdr"><div style="display:flex;align-items:center;gap:7px"><div class="live-dot"></div><span class="h3">All Team Activity</span></div></div>
      <div id="fullFeed" style="max-height:calc(100vh - 140px);overflow-y:auto"></div>
    </div>
    <div style="display:flex;flex-direction:column;gap:12px">
      <div class="card"><div class="card-hdr"><span class="h3">Who's Online</span></div><div id="feedPresence" style="padding:10px 14px;display:flex;flex-direction:column;gap:6px"></div></div>
      <div class="card"><div class="card-hdr"><span class="h3">Quick Stats</span></div><div id="feedStats" style="padding:10px 14px"></div></div>
    </div>
  </div>
</div>

<!-- LIBRARY -->
<div id="view-library" style="display:none">
  <div class="card" style="overflow:hidden">
    <div class="card-hdr">
      <div><div class="h3">Templates &amp; Resources</div><div class="caption" style="margin-top:2px">Shared document library</div></div>
      <button onclick="document.getElementById('libFileInput').click()" class="btn btn-primary btn-sm"><i class="fa-solid fa-cloud-arrow-up"></i> Upload</button>
    </div>
    <table class="tbl">
      <thead><tr><th>File</th><th>Size</th><th style="text-align:right">Actions</th></tr></thead>
      <tbody id="libTable"></tbody>
    </table>
  </div>
</div>

<!-- ARCHIVE -->
<div id="view-archive" style="display:none">
  <div class="card" style="overflow:hidden">
    <div class="card-hdr">
      <div><div class="h3">Archive</div><div class="caption" style="margin-top:2px">Closed &amp; completed projects</div></div>
      <div style="display:flex;gap:8px">
        <input id="archQ" class="inp inp-sm" style="width:180px" placeholder="Search…" oninput="renderArchive()">
        <button onclick="exportCSV()" class="btn btn-ghost btn-sm"><i class="fa-solid fa-file-csv"></i> Export</button>
      </div>
    </div>
    <table class="tbl">
      <thead><tr><th>ID</th><th>Title</th><th>Value (RM)</th><th>Status</th></tr></thead>
      <tbody id="archiveTable"></tbody>
    </table>
  </div>
</div>

<!-- METRICS -->
<div id="view-metrics" style="display:none">
  <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px">
    <div class="stat-card c-blue"><div class="stat-num" id="mTeam">—</div><div class="stat-lbl">Team Members</div></div>
    <div class="stat-card c-green"><div class="stat-num" id="mDone">—</div><div class="stat-lbl">Tasks Completed</div></div>
    <div class="stat-card c-amber"><div class="stat-num" id="mActive">—</div><div class="stat-lbl">Active Projects</div></div>
  </div>
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
    <div class="card"><div class="card-hdr"><span class="h3">Team Performance</span></div><div id="teamChart" style="padding:14px"></div></div>
    <div class="card"><div class="card-hdr"><span class="h3">Projects by Status</span></div><div id="statusChart" style="padding:14px"></div></div>
  </div>
</div>
