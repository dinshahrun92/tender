<script>
let tlCursor=new Date();
tlCursor.setDate(1);

function tlParseDate(v){
  if(!v||v==='-')return null;
  const normalized=typeof v==='string'?v.replace(' ','T'):v;
  const d=new Date(normalized);
  return isNaN(d.getTime())?null:d;
}
function tlEsc(v){
  return String(v||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function tlStatusColor(status){
  return{
    'Calling For Tender':'var(--slate)',
    'Active':'var(--amber)',
    'Review':'var(--purple)',
    'Submitted':'var(--blue)',
    'Successful':'var(--green)',
    'Closed':'var(--mute)',
    'Unsuccessful':'var(--red)',
    'Cancelled':'var(--mute2)'
  }[status]||'var(--slate)';
}

function tlShiftMonth(step){
  tlCursor.setMonth(tlCursor.getMonth()+step);
  renderTimeline();
}
function tlGoToday(){
  tlCursor=new Date();
  tlCursor.setDate(1);
  renderTimeline();
}

function renderTimeline(){
  const monthLabel=$('tlMonthLabel'),legend=$('tlLegend'),grid=$('tlGrid');
  if(!monthLabel||!legend||!grid)return;

  const start=new Date(tlCursor.getFullYear(),tlCursor.getMonth(),1,0,0,0,0);
  const end=new Date(tlCursor.getFullYear(),tlCursor.getMonth()+1,0,23,59,59,999);
  const monthMs=end-start+1;
  const daysInMonth=new Date(tlCursor.getFullYear(),tlCursor.getMonth()+1,0).getDate();

  monthLabel.textContent=tlCursor.toLocaleDateString(undefined,{month:'long',year:'numeric'});

  const source=(typeof getFiltered==='function'?getFiltered():allData)||[];
  const items=source
    .filter(t=>!['Closed','Unsuccessful','Cancelled'].includes(t.status))
    .map(t=>{
      const s=tlParseDate(t.startDate)||tlParseDate(t.dueDate);
      const d=tlParseDate(t.dueDate)||s;
      if(!s||!d)return null;
      const startDate=s<=d?s:d;
      const endDate=s<=d?d:s;
      return{...t,startDate,endDate};
    })
    .filter(Boolean)
    .filter(t=>t.endDate>=start&&t.startDate<=end)
    .sort((a,b)=>a.endDate-b.endDate);

  const statusCounts={};
  items.forEach(t=>{statusCounts[t.status]=(statusCounts[t.status]||0)+1;});
  legend.innerHTML=Object.keys(statusCounts).length
    ?Object.entries(statusCounts).map(([status,count])=>`<span style="display:inline-flex;align-items:center;gap:6px;background:var(--white);border:1px solid var(--line);border-radius:999px;padding:4px 10px;font-size:11px;font-weight:600;color:var(--ink)"><span style="width:8px;height:8px;border-radius:50%;background:${tlStatusColor(status)}"></span>${tlEsc(status)} <span style="color:var(--mute)">${count}</span></span>`).join('')
    :'<span class="caption">No projects in this month</span>';

  const dayHeaders=Array.from({length:daysInMonth},(_,i)=>`<div style="text-align:center;font-size:10px;color:var(--mute);padding:6px 0;border-left:${i===0?'none':'1px solid var(--line2)'}">${i+1}</div>`).join('');
  const rows=items.map(t=>{
    const barStart=Math.max(t.startDate,start);
    const barEnd=Math.min(t.endDate,end);
    const left=Math.max(0,((barStart-start)/monthMs)*100);
    const right=Math.min(100,((barEnd-start)/monthMs)*100);
    const width=Math.max(1,right-left);
    const color=tlStatusColor(t.status);
    return`<div style="display:grid;grid-template-columns:220px 1fr;border-top:1px solid var(--line)">
      <div onclick="openDrawer('${t.id}')" style="padding:10px 12px;cursor:pointer;background:var(--white)">
        <div style="display:flex;align-items:center;gap:6px;margin-bottom:3px"><span class="kcard-id">${tlEsc(t.id)}</span><span class="badge ${sc(t.status)}">${tlEsc(t.status)}</span></div>
        <div style="font-size:12px;font-weight:600;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${tlEsc(t.title)}</div>
        <div style="font-size:10px;color:var(--mute)">${tlEsc(t.startDate.toISOString().slice(0,10))} → ${tlEsc(t.endDate.toISOString().slice(0,10))}</div>
      </div>
      <div style="position:relative;background:linear-gradient(to right,var(--line2) 1px,transparent 1px);background-size:${100/daysInMonth}% 100%;min-height:58px">
        <div style="position:absolute;left:${left}%;top:50%;transform:translateY(-50%);width:${width}%;height:16px;border-radius:999px;background:${color};opacity:.9;box-shadow:var(--sh-sm)"></div>
      </div>
    </div>`;
  }).join('');

  grid.innerHTML=`<div style="border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden;background:var(--white)">
    <div style="display:grid;grid-template-columns:220px 1fr;background:var(--snow);border-bottom:1px solid var(--line)">
      <div style="padding:8px 12px;font-size:10px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--mute)">Project</div>
      <div style="display:grid;grid-template-columns:repeat(${daysInMonth},minmax(0,1fr));">${dayHeaders}</div>
    </div>
    ${rows||'<div style="padding:18px;text-align:center;color:var(--mute)">No active project spans this month</div>'}
  </div>`;
}
</script>
